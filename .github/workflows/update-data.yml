name: Update DATA

on:
  schedule:
    - cron: '*/30 * * * *'   # tiap 30 menit
  workflow_dispatch: {}       # bisa dipicu manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: update-dana100-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Jalankan scraper
        run: python fetch_data.py

      - name: Commit & push jika ada perubahan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Update DANA100 data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
